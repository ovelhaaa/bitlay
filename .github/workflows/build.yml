name: Build Bitlay (Windows)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Configure CMake
      run: >
        cmake -B build 
        -S cpp
        -DCMAKE_BUILD_TYPE=Release 
        -G "Visual Studio 17 2022" 
        -A x64

    - name: Build VST3 and Standalone
      run: cmake --build build --config Release --parallel 4

    - name: Upload Artifacts (VST3)
      uses: actions/upload-artifact@v4
      with:
        name: Bitlay-Windows-VST3
        path: build/Bitlay_artefacts/Release/VST3/Bitlay.vst3

    - name: Upload Artifacts (Standalone)
      uses: actions/upload-artifact@v4
      with:
        name: Bitlay-Windows-Standalone
        path: build/Bitlay_artefacts/Release/Standalone/Bitlay.exe
